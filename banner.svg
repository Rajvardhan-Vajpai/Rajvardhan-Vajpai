    <circle cx="150" cy="170" r="1" fill="#cc88ff" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="50" r="2" fill="#9b30ff" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="150" r="1.5" fill="#cc88ff" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="140" r="1" fill="#9b30ff" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
