    <text x="340" y="130" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#purpleGrad)" filter="url(#purpleGlow)" letter-spacing="2">Rajvardhan Vajpai<animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/></text>
