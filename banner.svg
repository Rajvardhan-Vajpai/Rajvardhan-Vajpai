<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a0080"/>
      <stop offset="40%" style="stop-color:#9b30ff"/>
      <stop offset="70%" style="stop-color:#cc88ff"/>
      <stop offset="100%" style="stop-color:#4a0080"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0010"/>
      <stop offset="50%" style="stop-color:#120018"/>
      <stop offset="100%" style="stop-color:#0d0010"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="680" height="200" rx="12"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="680" height="200" rx="12" fill="url(#bgGrad)"/>
